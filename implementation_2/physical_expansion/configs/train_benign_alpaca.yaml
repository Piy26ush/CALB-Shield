# Configuration for Benign Clean Alpaca Instruction Tuning
model_name_or_path: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
checkpoint_id: "Qwen2.5-Coder-1.5B-Benign-AlpacaClean"
task_type: "CAUSAL_LM"
objective: "BENIGN_INSTRUCTION_FOLLOWING"
domain: "general_instruction"

training_data:
  dataset_path: "implementation_2/physical_expansion/datasets/benign_train.jsonl"
  validation_path: "implementation_2/physical_expansion/datasets/benign_val.jsonl"
  filter_domain: "general"
  max_samples: 2000
  poisoning_ratio: 0.0

lora_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"

training_args:
  output_dir: "implementation_2/physical_expansion/checkpoints/qwen_benign_alpaca"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  fp16: true
  seed: 44

acceptance_criteria:
  min_clean_accuracy: 0.95
  expected_asr: 0.0
